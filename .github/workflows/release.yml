name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Check the version is not released yet
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists, nothing to release."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Install and verify
        if: env.SKIP != 'true'
        run: |
          yarn install --frozen-lockfile
          yarn verify

      # pi builds git installs itself, so the release carries no assets.
      - name: Create the release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # Skipped when the NPM_TOKEN secret is not set.
      - name: Publish to npm
        if: env.SKIP != 'true' && env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance
